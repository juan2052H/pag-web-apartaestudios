<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel administrativo · Apartaestudios</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2a78d6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preload" as="style" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" id="css-leaflet"
      integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/publico.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin">

<!-- ------------------------------------------------------------- Acceso -->
<div class="acceso" id="acceso" hidden>
  <div class="acceso-caja">
    <div class="logo">◈</div>
    <h1>Panel administrativo</h1>
    <p class="tenue mini">Ingresa como propietario principal o con tu cuenta de administrador de edificio.</p>
    <form id="form-acceso">
      <div class="campo">
        <label for="a-usuario">Usuario</label>
        <input id="a-usuario" name="usuario" autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="a-clave">Contraseña</label>
        <input id="a-clave" name="clave" type="password" autocomplete="current-password" required>
      </div>
      <div id="a-aviso"></div>
      <button class="btn btn-primario btn-lg btn-bloque" type="submit">Entrar</button>
    </form>
    <p class="mini tenue centro" style="margin-top:18px">
      <a href="/">← Volver al sitio público</a>
    </p>
  </div>
</div>

<!-- -------------------------------------------------------------- Panel -->
<div class="panel" id="panel" hidden>

  <aside class="lateral" id="lateral">
    <a href="/" class="marca"><span class="logo">◈</span><span id="lat-nombre">Apartaestudios</span></a>

    <button class="nav-item activo" data-vista="resumen"><span class="ic" aria-hidden="true">◫</span> Resumen</button>
    <button class="nav-item" data-vista="unidades"><span class="ic" aria-hidden="true">⌂</span> Unidades</button>
    <button class="nav-item" data-vista="edificios"><span class="ic" aria-hidden="true">▤</span> Edificios</button>

    <div class="grupo">Arriendos</div>
    <button class="nav-item" data-vista="contratos"><span class="ic" aria-hidden="true">✎</span> Contratos</button>
    <button class="nav-item" data-vista="pagos"><span class="ic" aria-hidden="true">◎</span> Pagos</button>
    <button class="nav-item" data-vista="cartera"><span class="ic" aria-hidden="true">⚑</span> Cartera</button>

    <div class="grupo">Gestión</div>
    <button class="nav-item" data-vista="mensajes"><span class="ic" aria-hidden="true">☏</span> Mensajes<span class="globo" id="globo-mensajes" hidden>0</span></button>
    <button class="nav-item" data-vista="solicitudes"><span class="ic" aria-hidden="true">✉</span> Solicitudes<span class="globo" id="globo-solicitudes" hidden>0</span></button>
    <button class="nav-item" data-vista="agenda"><span class="ic" aria-hidden="true">◷</span> Agenda de visitas</button>
    <button class="nav-item" data-vista="medios"><span class="ic" aria-hidden="true">▶</span> Multimedia</button>
    <button class="nav-item" data-vista="administradores" data-solo-principal hidden><span class="ic" aria-hidden="true">♙</span> Administradores</button>
    <button class="nav-item" data-vista="actividad" data-solo-principal hidden><span class="ic" aria-hidden="true">◉</span> Actividad</button>
    <button class="nav-item" data-vista="ajustes"><span class="ic" aria-hidden="true">⚙</span> Ajustes</button>

    <div class="pie-lateral">
      <a class="nav-item" href="/" target="_blank"><span class="ic" aria-hidden="true">↗</span> Ver sitio público</a>
      <button class="nav-item" id="btn-salir"><span class="ic" aria-hidden="true">⏻</span> Cerrar sesión</button>
    </div>
  </aside>

  <div class="contenido">
    <div class="barra-superior">
      <button class="icono-btn abrir-menu" id="btn-menu" type="button" aria-label="Abrir menú">☰</button>
      <div>
        <h1 id="titulo-vista">Resumen</h1>
        <div class="sub" id="sub-vista"></div>
      </div>
      <div class="sesion-rol mini" id="sesion-rol" hidden></div>
      <div class="barra-acciones" id="acciones-vista"></div>
      <button class="icono-btn" id="btn-tema" type="button" aria-label="Cambiar tema">☾</button>
    </div>

    <section class="vista activa" id="v-resumen"></section>
    <section class="vista" id="v-unidades"></section>
    <section class="vista" id="v-edificios"></section>
    <section class="vista" id="v-contratos"></section>
    <section class="vista" id="v-pagos"></section>
    <section class="vista" id="v-cartera"></section>
    <section class="vista" id="v-mensajes"></section>
    <section class="vista" id="v-solicitudes"></section>
    <section class="vista" id="v-agenda"></section>
    <section class="vista" id="v-medios"></section>
    <section class="vista" id="v-administradores"></section>
    <section class="vista" id="v-actividad"></section>
    <section class="vista" id="v-ajustes"></section>
  </div>
</div>

<div class="cargando" id="arranque"><div class="spinner"></div><span>Cargando panel…</span></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script src="/js/comun.js"></script>
<script src="/js/graficos.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
